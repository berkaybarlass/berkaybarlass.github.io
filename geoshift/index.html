<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoShift</title>
<meta name="robots" content="index,follow">
<style>
:root{--bg:#0b1020;--card:#151c2e;--text:#f8fafc;--muted:#94a3b8;--accent:#22d3ee;--indigo:#6366f1;--stroke:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 20px 64px}a{color:var(--accent)}
h1{font-size:30px;line-height:1.2;margin:0 0 6px}h2{font-size:19px;margin:32px 0 8px;color:var(--text)}
p,li{color:#cbd5e1}.meta{color:var(--muted);font-size:14px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:20px;padding:20px 22px;margin-top:20px}
.lang{float:right;font-size:14px}.brand{color:var(--accent);font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
</style>
</head>
<body><main>
<div class="brand">GEOSHIFT</div>
<h1>GeoShift</h1>
<p class="meta">Precision location simulation for Android — teleport, route simulation and a floating joystick.</p>
<div class="card">
<p><a href="privacy/">Privacy Policy</a> · <a href="privacy/tr/">Gizlilik Politikası</a></p>
</div>

</main></body>
</html>
